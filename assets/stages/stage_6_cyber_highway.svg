<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600">
  <defs>
    <linearGradient id="hwySky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080718" />
      <stop offset="60%" stop-color="#151230" />
      <stop offset="100%" stop-color="#1A1238" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="600" fill="url(#hwySky)" />

  <!-- Suspension Bridge Cables -->
  <g stroke="#483B75" stroke-width="2.5">
    <line x1="120" y1="0" x2="300" y2="530" />
    <line x1="320" y1="0" x2="480" y2="530" />
    <line x1="520" y1="0" x2="660" y2="530" />
    <line x1="880" y1="0" x2="1040" y2="530" />
    <line x1="1080" y1="0" x2="1220" y2="530" />
    <line x1="1280" y1="0" x2="1400" y2="530" />
  </g>

  <!-- Massive Bridge Towers -->
  <g fill="#211A42" stroke="#3A2E6E" stroke-width="2">
    <rect x="260" y="20" width="60" height="510" />
    <rect x="1020" y="20" width="60" height="510" />
  </g>

  <!-- Neon Horizon Speed Streaks -->
  <rect x="0" y="380" width="1600" height="3" fill="#00F5D4" opacity="0.6" />
  <rect x="0" y="410" width="1600" height="4" fill="#FF007F" opacity="0.5" />
  <rect x="0" y="440" width="1600" height="3" fill="#FFD166" opacity="0.5" />

  <!-- Highway Ground & Lane Dividers -->
  <rect x="0" y="530" width="1600" height="18" fill="#2E244E" />
  <rect x="0" y="530" width="1600" height="4" fill="#00F5D4" />
  <rect x="0" y="548" width="1600" height="52" fill="#110D24" />

  <!-- Glowing Cyan Dashed Road Line -->
  <g fill="#00F5D4">
    <rect x="60" y="565" width="80" height="8" rx="2" />
    <rect x="240" y="565" width="80" height="8" rx="2" />
    <rect x="420" y="565" width="80" height="8" rx="2" />
    <rect x="600" y="565" width="80" height="8" rx="2" />
    <rect x="780" y="565" width="80" height="8" rx="2" />
    <rect x="960" y="565" width="80" height="8" rx="2" />
    <rect x="1140" y="565" width="80" height="8" rx="2" />
    <rect x="1320" y="565" width="80" height="8" rx="2" />
    <rect x="1500" y="565" width="80" height="8" rx="2" />
  </g>
</svg>
