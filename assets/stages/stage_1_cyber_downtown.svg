<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600">
  <defs>
    <linearGradient id="skyGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080718" />
      <stop offset="60%" stop-color="#141132" />
      <stop offset="100%" stop-color="#0C0A1F" />
    </linearGradient>
    <linearGradient id="neonBillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FD1C5" />
      <stop offset="100%" stop-color="#9D4EDD" />
    </linearGradient>
    <linearGradient id="neonBillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007F" />
      <stop offset="100%" stop-color="#FFD166" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="600" fill="url(#skyGrad1)" />

  <!-- Cyber Skyscrapers Layer 1 -->
  <g fill="#161332">
    <rect x="50" y="40" width="150" height="490" />
    <rect x="250" y="90" width="180" height="440" />
    <rect x="480" y="30" width="160" height="500" />
    <rect x="690" y="70" width="190" height="460" />
    <rect x="930" y="20" width="170" height="510" />
    <rect x="1150" y="80" width="160" height="450" />
    <rect x="1360" y="50" width="190" height="480" />
  </g>

  <!-- Glowing Windows Matrix -->
  <g fill="#00F5D4" opacity="0.3">
    <rect x="70" y="70" width="15" height="15" /><rect x="95" y="70" width="15" height="15" /><rect x="120" y="70" width="15" height="15" />
    <rect x="70" y="110" width="15" height="15" /><rect x="120" y="110" width="15" height="15" />
    <rect x="510" y="60" width="20" height="18" /><rect x="550" y="60" width="20" height="18" /><rect x="590" y="60" width="20" height="18" />
    <rect x="960" y="50" width="18" height="18" /><rect x="1000" y="50" width="18" height="18" /><rect x="1040" y="50" width="18" height="18" />
  </g>

  <!-- Holographic Neon Billboards -->
  <g id="billboard-1">
    <rect x="270" y="120" width="140" height="70" rx="6" fill="#15122B" stroke="#4FD1C5" stroke-width="2.5" />
    <text x="285" y="152" font-family="'Arial Black', sans-serif" font-weight="900" font-size="18" fill="url(#neonBillGrad1)">CYBER CITY</text>
    <text x="305" y="172" font-family="'Arial Black', sans-serif" font-size="12" fill="#FFD166">2099 OVERDRIVE</text>
  </g>

  <g id="billboard-2">
    <rect x="710" y="100" width="150" height="75" rx="6" fill="#15122B" stroke="#FF007F" stroke-width="2.5" />
    <text x="735" y="135" font-family="'Arial Black', sans-serif" font-weight="900" font-size="20" fill="url(#neonBillGrad2)">ARCADE</text>
    <text x="745" y="158" font-family="'Arial Black', sans-serif" font-size="14" fill="#00F5D4">★ BATTLE ★</text>
  </g>

  <g id="billboard-3">
    <rect x="1170" y="110" width="120" height="60" rx="6" fill="#15122B" stroke="#FFD166" stroke-width="2.5" />
    <text x="1185" y="145" font-family="'Arial Black', sans-serif" font-weight="900" font-size="16" fill="#FFD166">NEO-TOKYO</text>
  </g>

  <!-- Ground Curb & Street -->
  <rect x="0" y="530" width="1600" height="18" fill="#2E284E" />
  <rect x="0" y="530" width="1600" height="4" fill="#00F5D4" />
  <rect x="0" y="548" width="1600" height="52" fill="#151228" />
</svg>
