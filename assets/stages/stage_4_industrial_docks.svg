<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600">
  <defs>
    <linearGradient id="docksSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A0817" />
      <stop offset="70%" stop-color="#16122B" />
      <stop offset="100%" stop-color="#1F1A3B" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="600" fill="url(#docksSky)" />

  <!-- Harbor Cranes Silhouettes -->
  <g stroke="#261E40" stroke-width="4" fill="none">
    <!-- Crane 1 -->
    <rect x="180" y="100" width="90" height="430" />
    <line x1="180" y1="100" x2="350" y2="40" />
    <line x1="180" y1="180" x2="270" y2="100" />
    <!-- Crane 2 -->
    <rect x="880" y="80" width="100" height="450" />
    <line x1="880" y1="80" x2="1070" y2="20" />
    <line x1="880" y1="170" x2="980" y2="80" />
  </g>

  <!-- Stacked Shipping Containers Layer 1 -->
  <g id="containers">
    <rect x="60" y="430" width="180" height="100" rx="3" fill="#4B243B" stroke="#220F1A" stroke-width="2" />
    <rect x="250" y="430" width="170" height="100" rx="3" fill="#203947" stroke="#0E1B22" stroke-width="2" />
    <rect x="150" y="330" width="180" height="100" rx="3" fill="#6C5CE7" stroke="#3A2C87" stroke-width="2" />

    <rect x="520" y="430" width="190" height="100" rx="3" fill="#8854D0" stroke="#4C267D" stroke-width="2" />

    <rect x="780" y="430" width="180" height="100" rx="3" fill="#203947" stroke="#0E1B22" stroke-width="2" />
    <rect x="970" y="430" width="170" height="100" rx="3" fill="#4B243B" stroke="#220F1A" stroke-width="2" />
    <rect x="870" y="330" width="180" height="100" rx="3" fill="#FF70A6" stroke="#A82A5A" stroke-width="2" />

    <rect x="1220" y="430" width="180" height="100" rx="3" fill="#203947" stroke="#0E1B22" stroke-width="2" />
    <rect x="1410" y="430" width="170" height="100" rx="3" fill="#4B243B" stroke="#220F1A" stroke-width="2" />
    <rect x="1310" y="330" width="180" height="100" rx="3" fill="#00F5D4" stroke="#00806E" stroke-width="2" />
  </g>

  <!-- Pier Concrete Edge & Water Reflection -->
  <rect x="0" y="530" width="1600" height="18" fill="#302848" />
  <rect x="0" y="530" width="1600" height="4" fill="#4FD1C5" />
  <rect x="0" y="548" width="1600" height="52" fill="#110E1C" />
</svg>
