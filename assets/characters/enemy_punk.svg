<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220" width="160" height="220">
  <defs>
    <!-- Skin Tones -->
    <linearGradient id="punkSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE7D6"/>
      <stop offset="60%" stop-color="#F1C2A5"/>
      <stop offset="100%" stop-color="#D49A78"/>
    </linearGradient>

    <!-- Black Leather Vest -->
    <linearGradient id="punkVest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="50%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Blue Denim Jeans -->
    <linearGradient id="punkJeans" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2B4C72"/>
      <stop offset="50%" stop-color="#3B6998"/>
      <stop offset="100%" stop-color="#23456B"/>
    </linearGradient>

    <!-- Brown Leather Biker Boots -->
    <linearGradient id="punkBoots" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5A2B"/>
      <stop offset="70%" stop-color="#6F421D"/>
      <stop offset="100%" stop-color="#4A2810"/>
    </linearGradient>

    <!-- Handgun Metal -->
    <linearGradient id="punkGun" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="80" cy="208" rx="38" ry="7" fill="rgba(15, 12, 28, 0.45)"/>

  <!-- Right Leg & Biker Boot (Back Leg) -->
  <g id="punk-leg-right">
    <!-- Denim Pants -->
    <path d="M84 134 L100 134 L96 186 L80 186 Z" fill="#23456B"/>
    <!-- Brown Leather Boot -->
    <path d="M78 184 L102 184 L106 204 L74 204 Z" fill="url(#punkBoots)"/>
    <!-- Boot Sole & Heel -->
    <rect x="74" y="202" width="34" height="6" rx="1" fill="#2E1B0E"/>
    <rect x="94" y="204" width="14" height="4" fill="#1C1108"/> <!-- Heel block -->
    <!-- Boot Buckle / Strap -->
    <line x1="82" y1="190" x2="98" y2="190" stroke="#9CA3AF" stroke-width="2"/>
  </g>

  <!-- Left Leg & Biker Boot (Front Leg) -->
  <g id="punk-leg-left">
    <!-- Denim Pants -->
    <path d="M68 134 L86 134 L84 186 L64 186 Z" fill="url(#punkJeans)"/>
    <!-- Knee highlight & fold -->
    <path d="M69 152 L83 150 L81 164 L67 166 Z" fill="#4B77A6"/>
    <!-- Brown Leather Boot -->
    <path d="M60 184 L86 184 L88 204 L56 204 Z" fill="url(#punkBoots)"/>
    <!-- Boot Sole & Heel -->
    <rect x="56" y="202" width="34" height="6" rx="1" fill="#2E1B0E"/>
    <rect x="76" y="204" width="14" height="4" fill="#1C1108"/>
    <!-- Boot Buckle / Strap -->
    <line x1="64" y1="190" x2="80" y2="190" stroke="#D1D5DB" stroke-width="2"/>
  </g>

  <!-- Torso: White Shirt & Black Leather Motorcycle Vest -->
  <g id="punk-torso">
    <!-- White Undershirt -->
    <rect x="66" y="78" width="28" height="58" rx="3" fill="#F8FAFC"/>
    <path d="M68 76 Q80 84 92 76 Z" fill="#E2E8F0"/>

    <!-- Black Leather Motorcycle Vest Body -->
    <path d="M58 76 L104 76 L100 136 L56 136 Z" fill="url(#punkVest)"/>
    <!-- Vest Lapels -->
    <polygon points="62,76 74,96 68,126 58,126" fill="#111827"/>
    <polygon points="100,76 88,96 94,126 102,126" fill="#111827"/>
    <!-- Silver Snap Buttons / Studs on Lapel -->
    <circle cx="68" cy="88" r="2" fill="#E5E7EB"/>
    <circle cx="94" cy="88" r="2" fill="#E5E7EB"/>
    <circle cx="66" cy="106" r="2" fill="#E5E7EB"/>
    <circle cx="96" cy="106" r="2" fill="#E5E7EB"/>

    <!-- Belt with Heavy Silver Buckle -->
    <rect x="58" y="132" width="42" height="6" fill="#111827"/>
    <rect x="74" y="130" width="12" height="10" rx="1" fill="#D1D5DB"/>
    <rect x="77" y="132" width="6" height="6" fill="#111827"/>
  </g>

  <!-- Head & Hair (Undercut Mohawk Pompadour, Facing Left) -->
  <g id="punk-head">
    <!-- Neck -->
    <rect x="74" y="62" width="14" height="16" fill="url(#punkSkin)"/>
    <!-- Head Base / Jawline -->
    <path d="M68 38 L92 38 Q94 56 88 66 L72 66 Q64 56 68 38 Z" fill="url(#punkSkin)"/>
    <!-- Ear -->
    <ellipse cx="92" cy="50" rx="3.5" ry="6" fill="#D49A78"/>
    <circle cx="92" cy="53" r="1.5" fill="#E5E7EB"/> <!-- Silver stud earring -->

    <!-- Black Textured Mohawk Hair -->
    <path d="M64 24 Q78 12 94 20 L96 36 L92 40 L70 38 L64 36 Z" fill="#18181B"/>
    <polygon points="64,24 62,32 68,36" fill="#27272A"/> <!-- Front tuft -->
    <polygon points="72,16 78,10 84,20" fill="#27272A"/> <!-- Spiked top -->
    <!-- Shaved Undercut Side -->
    <path d="M78 36 L90 36 L88 48 L80 46 Z" fill="#4B3B32"/>

    <!-- Angry / Smug Eyes & Eyebrow (Facing Left) -->
    <line x1="68" y1="44" x2="80" y2="42" stroke="#18181B" stroke-width="2.5"/>
    <ellipse cx="73" cy="48" rx="3" ry="2" fill="#FFFFFF"/>
    <circle cx="71.5" cy="48" r="1.5" fill="#18181B"/> <!-- Looking left at player -->
    <!-- Nose & Mouth (Determined smirk) -->
    <path d="M66 48 L63 54 L68 55" stroke="#9A5B38" stroke-width="1.5" fill="none"/>
    <line x1="68" y1="60" x2="76" y2="59" stroke="#783E1E" stroke-width="2"/>
  </g>

  <!-- Right Arm (Back Arm with White Sleeve) -->
  <g id="punk-arm-back">
    <rect x="94" y="76" width="14" height="16" rx="4" fill="#F8FAFC"/>
    <path d="M96 90 L108 106 L100 112 L92 94 Z" fill="url(#punkSkin)"/>
  </g>

  <!-- Left Arm with Tattoo Aiming Handgun (Facing Left) -->
  <g id="punk-arm-gun">
    <!-- White Short Sleeve -->
    <rect x="58" y="76" width="16" height="14" rx="3" fill="#F8FAFC"/>
    <!-- Bare Bicep with Skull Tattoo -->
    <path d="M66 84 L38 84 L36 96 L64 96 Z" fill="url(#punkSkin)"/>
    <!-- Skull Tattoo on Bicep -->
    <ellipse cx="50" cy="89" rx="3" ry="2.5" fill="#334155"/>
    <circle cx="49" cy="88.5" r="0.7" fill="#F1C2A5"/>
    <circle cx="51" cy="88.5" r="0.7" fill="#F1C2A5"/>
    <line x1="47" y1="91" x2="53" y2="91" stroke="#334155" stroke-width="1"/>

    <!-- Hand Gripping Weapon -->
    <rect x="30" y="86" width="9" height="10" rx="3" fill="url(#punkSkin)"/>

    <!-- Heavy Street Handgun -->
    <!-- Grip / Handle -->
    <rect x="28" y="94" width="7" height="14" rx="2" fill="#1F2937" transform="rotate(-12, 31, 101)"/>
    <!-- Main Slide & Receiver -->
    <rect x="6" y="82" width="32" height="13" rx="2" fill="url(#punkGun)"/>
    <!-- Barrel Crown -->
    <rect x="0" y="85" width="7" height="7" fill="#0F172A"/>
    <!-- Iron Sights -->
    <rect x="6" y="79" width="3" height="3" fill="#9CA3AF"/>
    <rect x="30" y="79" width="3" height="3" fill="#9CA3AF"/>
    <!-- Ejection Port -->
    <rect x="18" y="84" width="6" height="3" fill="#0F172A"/>
  </g>
</svg>
