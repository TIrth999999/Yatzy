<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220" width="160" height="220">
  <defs>
    <linearGradient id="mercSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="mercJacket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="mercPants" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="mercGun" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="mercLaser" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <ellipse cx="80" cy="208" rx="38" ry="7" fill="rgba(15, 12, 28, 0.45)"/>

  <!-- Right Leg (Back) -->
  <g id="merc-leg-right">
    <path d="M84 134 L100 134 L96 186 L80 186 Z" fill="#0F172A"/>
    <path d="M78 184 L102 184 L106 204 L74 204 Z" fill="#1E293B"/>
    <rect x="74" y="202" width="34" height="6" rx="1" fill="#090D16"/>
  </g>

  <!-- Left Leg (Front) -->
  <g id="merc-leg-left">
    <path d="M68 134 L86 134 L84 186 L64 186 Z" fill="url(#mercPants)"/>
    <path d="M60 184 L86 184 L88 204 L56 204 Z" fill="#334155"/>
    <rect x="56" y="202" width="34" height="6" rx="1" fill="#090D16"/>
    <!-- Tactical Holster on Thigh -->
    <rect x="66" y="148" width="16" height="20" rx="3" fill="#0F172A"/>
    <line x1="62" y1="152" x2="84" y2="152" stroke="#4B5563" stroke-width="1.5"/>
  </g>

  <!-- Torso: Tactical Stealth Armor Vest -->
  <g id="merc-torso">
    <rect x="66" y="78" width="28" height="58" rx="3" fill="#1E1B4B"/>
    <path d="M58 76 L104 76 L100 136 L56 136 Z" fill="url(#mercJacket)"/>
    <!-- Kevlar Armor Plates -->
    <rect x="66" y="82" width="28" height="20" rx="2" fill="#0F172A"/>
    <rect x="68" y="106" width="24" height="22" rx="2" fill="#0F172A"/>
    <!-- Utility Pouches -->
    <rect x="62" y="128" width="8" height="10" rx="1" fill="#374151"/>
    <rect x="72" y="128" width="8" height="10" rx="1" fill="#374151"/>
    <rect x="82" y="128" width="8" height="10" rx="1" fill="#374151"/>
  </g>

  <!-- Head & Shades -->
  <g id="merc-head">
    <rect x="74" y="62" width="14" height="16" fill="url(#mercSkin)"/>
    <path d="M68 38 L92 38 Q94 56 88 66 L72 66 Q64 56 68 38 Z" fill="url(#mercSkin)"/>
    <!-- Short Textured Crop Hair -->
    <path d="M66 36 L70 20 Q82 14 94 22 L96 36 L92 40 L68 38 Z" fill="#18181B"/>
    <!-- Cyber Tactical Shades (Facing Left) -->
    <polygon points="64,44 88,44 86,52 66,52" fill="#090D16"/>
    <line x1="64" y1="48" x2="86" y2="48" stroke="#A855F7" stroke-width="2" filter="url(#mercLaser)"/>
    <!-- Ear & Comm Headset -->
    <circle cx="92" cy="50" r="4" fill="#374151"/>
    <line x1="92" y1="52" x2="80" y2="60" stroke="#9CA3AF" stroke-width="1.5"/>
  </g>

  <!-- Left Arm Aiming Tactical SMG (Facing Left) -->
  <g id="merc-arm-gun">
    <circle cx="68" cy="80" r="9" fill="#4C1D95"/>
    <path d="M68 76 L36 84 L38 96 L68 90 Z" fill="url(#mercJacket)"/>
    <rect x="30" y="86" width="9" height="10" rx="3" fill="url(#mercSkin)"/>

    <!-- Tactical Cyber SMG -->
    <rect x="28" y="94" width="7" height="14" rx="2" fill="#0F172A" transform="rotate(-12, 31, 101)"/>
    <rect x="2" y="82" width="36" height="13" rx="2" fill="url(#mercGun)"/>
    <rect x="-4" y="85" width="7" height="7" fill="#090D16"/> <!-- Barrel -->
    <!-- Curved Magazine -->
    <path d="M20 95 L16 112 L22 112 L25 95 Z" fill="#475569"/>
    <!-- Top Tactical Rail & Laser Sight -->
    <rect x="8" y="78" width="22" height="4" fill="#0F172A"/>
    <line x1="8" y1="80" x2="-2" y2="80" stroke="#EF4444" stroke-width="1.5" filter="url(#mercLaser)"/>
  </g>
</svg>
