<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 230" width="180" height="230">
  <defs>
    <linearGradient id="bossArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="50%" stop-color="#4C0519"/>
      <stop offset="100%" stop-color="#180208"/>
    </linearGradient>
    <linearGradient id="bossGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
    <linearGradient id="bossGatling" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="50%" stop-color="#3F3F46"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <filter id="bossGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Large Shadow Base -->
  <ellipse cx="90" cy="216" rx="52" ry="9" fill="rgba(10, 8, 20, 0.55)"/>

  <!-- Right Armored Mech Leg (Back) -->
  <g id="boss-leg-right">
    <rect x="94" y="132" width="24" height="64" rx="6" fill="url(#bossArmor)"/>
    <rect x="92" y="156" width="28" height="18" rx="4" fill="#18181B"/>
    <path d="M90 200 L122 200 L126 216 L84 216 Z" fill="url(#bossGold)"/>
    <rect x="84" y="212" width="42" height="6" fill="#09090B"/>
  </g>

  <!-- Left Armored Mech Leg (Front) -->
  <g id="boss-leg-left">
    <rect x="66" y="136" width="24" height="60" rx="6" fill="url(#bossArmor)"/>
    <rect x="64" y="162" width="28" height="20" rx="4" fill="#27272A"/>
    <circle cx="78" cy="172" r="5" fill="#E11D48"/>
    <path d="M62 200 L96 200 L100 216 L56 216 Z" fill="url(#bossGold)"/>
    <rect x="56" y="212" width="44" height="6" fill="#09090B"/>
  </g>

  <!-- Massive Titan Chassis Torso -->
  <g id="boss-torso">
    <rect x="56" y="74" width="56" height="70" rx="8" fill="url(#bossArmor)"/>
    <!-- Heavy Ballistic Gold Trim Plates -->
    <path d="M58 78 L84 78 L80 112 L60 112 Z" fill="#27272A"/>
    <path d="M86 78 L110 78 L108 112 L88 112 Z" fill="#27272A"/>
    <path d="M64 78 L78 78 L76 100 L66 100 Z" fill="url(#bossGold)"/>
    <path d="M90 78 L104 78 L102 100 L92 100 Z" fill="url(#bossGold)"/>
    <!-- Core Reactor (Glowing Magenta/Crimson) -->
    <circle cx="84" cy="98" r="9" fill="#E11D48" filter="url(#bossGlow)"/>
    <circle cx="84" cy="98" r="4.5" fill="#FFFFFF"/>
    <!-- Heavy Belt & Power Conduits -->
    <rect x="54" y="136" width="60" height="12" rx="3" fill="#09090B"/>
    <circle cx="68" cy="142" r="3.5" fill="url(#bossGold)"/>
    <circle cx="84" cy="142" r="3.5" fill="url(#bossGold)"/>
    <circle cx="100" cy="142" r="3.5" fill="url(#bossGold)"/>
  </g>

  <!-- Head, Demon Horns & Crown Crest -->
  <g id="boss-head">
    <rect x="76" y="62" width="16" height="16" fill="#18181B"/>
    <rect x="68" y="28" width="34" height="38" rx="8" fill="url(#bossArmor)"/>
    <path d="M68 46 L102 46 L98 68 L72 68 Z" fill="#09090B"/>
    <!-- Golden Horns / Crown -->
    <path d="M68 32 L52 14 L62 30 Z" fill="url(#bossGold)"/>
    <path d="M102 32 L118 14 L108 30 Z" fill="url(#bossGold)"/>
    <path d="M78 28 L85 10 L92 28 Z" fill="url(#bossGold)"/>
    <!-- Fierce Visor Slit (Facing Left) -->
    <polygon points="64,44 94,44 92,52 64,52" fill="#E11D48" filter="url(#bossGlow)"/>
    <line x1="66" y1="48" x2="90" y2="48" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- Dual Gatling Cannon & Heavy Exo-Arm (Facing Left) -->
  <g id="boss-arm-gun">
    <!-- Massive Spiked Shoulder Pauldron -->
    <rect x="74" y="68" width="24" height="22" rx="5" fill="url(#bossGold)"/>
    <polygon points="80,68 86,52 92,68" fill="url(#bossGold)"/>
    <!-- Exo Arm -->
    <path d="M80 76 L36 76 L34 98 L80 98 Z" fill="url(#bossArmor)"/>
    <rect x="28" y="78" width="12" height="18" rx="3" fill="#09090B"/>

    <!-- Dual Gatling Plasma Cannon -->
    <!-- Receiver Box -->
    <rect x="-12" y="68" width="48" height="32" rx="4" fill="url(#bossGatling)"/>
    <rect x="4" y="62" width="24" height="8" rx="2" fill="url(#bossGold)"/>
    <!-- Ammo Belt Conduit -->
    <path d="M24 94 Q44 116 66 112" stroke="#EAB308" stroke-width="5" fill="none"/>
    <!-- Upper Multi-Barrels -->
    <rect x="-38" y="72" width="28" height="6" fill="#27272A"/>
    <rect x="-48" y="71" width="12" height="8" fill="url(#bossGold)"/>
    <!-- Lower Multi-Barrels -->
    <rect x="-38" y="86" width="28" height="6" fill="#27272A"/>
    <rect x="-48" y="85" width="12" height="8" fill="url(#bossGold)"/>
    <!-- Rotating Barrel Ring Stabilizers -->
    <rect x="-30" y="70" width="4" height="24" fill="#E11D48" filter="url(#bossGlow)"/>
    <rect x="-42" y="70" width="4" height="24" fill="#E11D48" filter="url(#bossGlow)"/>
  </g>
</svg>
