<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 230" width="180" height="230">
  <defs>
    <linearGradient id="bossSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B0716"/>
      <stop offset="50%" stop-color="#1F040C"/>
      <stop offset="100%" stop-color="#0F0206"/>
    </linearGradient>
    <linearGradient id="bossGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
    <linearGradient id="bossGatling" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="50%" stop-color="#3F3F46"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <filter id="bossRedGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <ellipse cx="90" cy="216" rx="52" ry="9" fill="rgba(15, 12, 28, 0.55)"/>

  <!-- Legs -->
  <g id="boss-legs">
    <path d="M96 132 L120 132 L116 196 L92 196 Z" fill="#09090B"/>
    <path d="M90 194 L122 194 L126 214 L84 214 Z" fill="url(#bossGold)"/>
    <rect x="84" y="212" width="42" height="6" rx="1" fill="#09090B"/>

    <path d="M72 134 L96 134 L94 196 L68 196 Z" fill="url(#bossSuit)"/>
    <path d="M62 194 L96 194 L100 214 L56 214 Z" fill="url(#bossGold)"/>
    <rect x="56" y="212" width="44" height="6" rx="1" fill="#09090B"/>
  </g>

  <!-- Heavy Torso with Gold Chains -->
  <g id="boss-torso">
    <rect x="60" y="72" width="60" height="74" rx="8" fill="url(#bossSuit)"/>
    <!-- Gold Trim Lapels -->
    <path d="M64 74 L84 74 L80 116 L62 116 Z" fill="#18181B"/>
    <path d="M96 74 L116 74 L114 116 L96 116 Z" fill="#18181B"/>
    <path d="M68 76 L78 76 L76 102 L66 102 Z" fill="url(#bossGold)"/>
    <path d="M102 76 L112 76 L110 102 L100 102 Z" fill="url(#bossGold)"/>

    <!-- Glowing Chest Core -->
    <circle cx="90" cy="98" r="8" fill="#E11D48" filter="url(#bossRedGlow)"/>
    <circle cx="90" cy="98" r="3.5" fill="#FFFFFF"/>

    <!-- Heavy Gold Chains -->
    <path d="M76 84 Q90 112 104 84" stroke="url(#bossGold)" stroke-width="3" fill="none"/>
    <path d="M72 88 Q90 120 108 88" stroke="url(#bossGold)" stroke-width="3" fill="none"/>
    <rect x="58" y="136" width="64" height="10" fill="#09090B"/>
  </g>

  <!-- Head & Golden Horned Crest (Facing Left) -->
  <g id="boss-head">
    <rect x="80" y="58" width="20" height="18" fill="#18181B"/>
    <rect x="72" y="28" width="36" height="38" rx="8" fill="url(#bossSuit)"/>
    <!-- Golden Horns / Crown Crest -->
    <path d="M72 32 L54 14 L64 30 Z" fill="url(#bossGold)"/>
    <path d="M106 32 L124 14 L114 30 Z" fill="url(#bossGold)"/>
    <path d="M84 28 L90 8 L96 28 Z" fill="url(#bossGold)"/>
    <!-- Fierce Visor Slit -->
    <polygon points="68,44 98,44 96,52 68,52" fill="#E11D48" filter="url(#bossRedGlow)"/>
    <line x1="70" y1="48" x2="94" y2="48" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- Arm Aiming Dual Gatling Cannon (Facing Left) -->
  <g id="boss-arm-gun">
    <rect x="76" y="68" width="22" height="20" rx="5" fill="url(#bossGold)"/>
    <path d="M80 76 L34 84 L36 100 L80 94 Z" fill="url(#bossSuit)"/>
    <rect x="28" y="86" width="12" height="16" rx="3" fill="#09090B"/>

    <!-- Dual Gatling Cannon -->
    <rect x="-16" y="72" width="50" height="32" rx="4" fill="url(#bossGatling)"/>
    <rect x="2" y="66" width="26" height="8" rx="2" fill="url(#bossGold)"/>
    <!-- Upper Barrel -->
    <rect x="-42" y="76" width="28" height="6" fill="#27272A"/>
    <rect x="-52" y="75" width="12" height="8" fill="url(#bossGold)"/>
    <!-- Lower Barrel -->
    <rect x="-42" y="90" width="28" height="6" fill="#27272A"/>
    <rect x="-52" y="89" width="12" height="8" fill="url(#bossGold)"/>
    <!-- Ring Stabilizers -->
    <rect x="-34" y="74" width="4" height="24" fill="#E11D48" filter="url(#bossRedGlow)"/>
    <rect x="-46" y="74" width="4" height="24" fill="#E11D48" filter="url(#bossRedGlow)"/>
  </g>
</svg>
