<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220" width="160" height="220">
  <defs>
    <linearGradient id="cybSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="cybArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cybGun" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="cybRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <ellipse cx="80" cy="208" rx="40" ry="7" fill="rgba(15, 12, 28, 0.45)"/>

  <!-- Legs -->
  <g id="cyb-legs">
    <path d="M84 134 L102 134 L98 186 L80 186 Z" fill="#0F172A"/>
    <path d="M78 184 L104 184 L108 204 L74 204 Z" fill="#1E293B"/>
    <rect x="74" y="202" width="36" height="6" rx="1" fill="#0284C7"/>

    <path d="M66 134 L84 134 L82 186 L62 186 Z" fill="url(#cybArmor)"/>
    <path d="M58 184 L84 184 L86 204 L54 204 Z" fill="#334155"/>
    <rect x="54" y="202" width="34" height="6" rx="1" fill="#0284C7"/>
  </g>

  <!-- Armored Torso -->
  <g id="cyb-torso">
    <rect x="64" y="76" width="32" height="60" rx="4" fill="url(#cybArmor)"/>
    <!-- Ballistic Chest Plates -->
    <path d="M64 80 L78 80 L76 104 L66 104 Z" fill="#475569"/>
    <path d="M82 80 L96 80 L94 104 L84 104 Z" fill="#475569"/>
    <!-- Glowing Arc Core -->
    <circle cx="80" cy="94" r="5" fill="#EF4444" filter="url(#cybRed)"/>
    <circle cx="80" cy="94" r="2" fill="#FFFFFF"/>
    <!-- Tactical Belt -->
    <rect x="62" y="132" width="36" height="6" fill="#0F172A"/>
  </g>

  <!-- Head with Glowing Red Ocular Sensor (Facing Left) -->
  <g id="cyb-head">
    <rect x="74" y="62" width="14" height="16" fill="#0F172A"/>
    <path d="M68 38 L92 38 Q94 56 88 66 L72 66 Q64 56 68 38 Z" fill="url(#cybSkin)"/>
    <!-- Armored Helmet / Cranium -->
    <path d="M66 38 L68 20 Q80 14 94 20 L96 38 L92 42 L68 40 Z" fill="#1E293B"/>
    <!-- Ocular Scanner Sensor -->
    <rect x="64" y="44" width="14" height="5" rx="1.5" fill="#EF4444" filter="url(#cybRed)"/>
    <rect x="66" y="45.5" width="8" height="2" fill="#FFFFFF"/>
  </g>

  <!-- Arm Aiming Heavy Assault Rifle (Facing Left) -->
  <g id="cyb-arm-gun">
    <circle cx="68" cy="80" r="10" fill="#1E293B"/>
    <path d="M68 76 L34 84 L36 96 L68 90 Z" fill="url(#cybArmor)"/>
    <rect x="28" y="86" width="9" height="10" rx="3" fill="#0F172A"/>

    <!-- Heavy Assault Plasma Rifle -->
    <rect x="26" y="94" width="7" height="14" rx="2" fill="#0F172A" transform="rotate(-12, 29, 101)"/>
    <rect x="-10" y="82" width="46" height="14" rx="2" fill="url(#cybGun)"/>
    <!-- Barrel & Heavy Brake -->
    <rect x="-18" y="85" width="9" height="8" fill="#0F172A"/>
    <rect x="-24" y="84" width="7" height="10" fill="#334155"/>
    <!-- Plasma Core Rail -->
    <rect x="-2" y="86" width="18" height="3" fill="#00F5D4"/>
    <!-- Scope -->
    <rect x="2" y="76" width="20" height="6" fill="#0F172A"/>
    <circle cx="4" cy="79" r="2" fill="#EF4444"/>
  </g>
</svg>
