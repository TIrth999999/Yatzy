<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220" width="160" height="220">
  <defs>
    <linearGradient id="cybArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cybPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="cybGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Shadow Base -->
  <ellipse cx="80" cy="208" rx="40" ry="7" fill="rgba(10, 8, 20, 0.45)"/>

  <!-- Right Leg (Back) -->
  <g id="cyb-leg-right">
    <rect x="84" y="134" width="18" height="56" rx="4" fill="url(#cybArmor)"/>
    <rect x="82" y="152" width="22" height="12" rx="2" fill="url(#cybPlate)"/>
    <!-- Mechanical Joint -->
    <circle cx="93" cy="158" r="4" fill="#00F5D4"/>
    <path d="M82 190 L108 190 L112 206 L78 206 Z" fill="#0F172A"/>
    <rect x="78" y="202" width="34" height="6" fill="#06B6D4"/>
  </g>

  <!-- Left Leg (Front) -->
  <g id="cyb-leg-left">
    <rect x="60" y="136" width="18" height="54" rx="4" fill="url(#cybArmor)"/>
    <rect x="58" y="156" width="22" height="14" rx="3" fill="url(#cybPlate)"/>
    <circle cx="69" cy="163" r="4" fill="#00F5D4"/>
    <path d="M56 190 L82 190 L86 206 L52 206 Z" fill="url(#cybPlate)"/>
    <rect x="52" y="202" width="34" height="6" fill="#06B6D4"/>
  </g>

  <!-- Heavy Armored Torso -->
  <g id="cyb-torso">
    <rect x="58" y="78" width="42" height="60" rx="6" fill="url(#cybArmor)"/>
    <!-- Chest Ballistic Chassis Plates -->
    <path d="M60 82 L78 82 L76 104 L62 104 Z" fill="url(#cybPlate)"/>
    <path d="M80 82 L98 82 L96 104 L82 104 Z" fill="url(#cybPlate)"/>
    <rect x="64" y="108" width="30" height="24" rx="3" fill="#1E293B"/>
    <!-- Central Power Arc Reactor (Glowing Red) -->
    <circle cx="79" cy="94" r="6" fill="#EF4444" filter="url(#cybGlow)"/>
    <circle cx="79" cy="94" r="2.5" fill="#FFFFFF"/>
    <!-- Exoskeleton Ribs -->
    <line x1="60" y1="114" x2="98" y2="114" stroke="#00F5D4" stroke-width="2"/>
    <line x1="62" y1="122" x2="96" y2="122" stroke="#00F5D4" stroke-width="2"/>
  </g>

  <!-- Head & Cybernetic Helmet -->
  <g id="cyb-head">
    <rect x="74" y="66" width="12" height="14" fill="#0F172A"/>
    <rect x="64" y="32" width="30" height="36" rx="6" fill="url(#cybArmor)"/>
    <path d="M64 48 L94 48 L92 68 L66 68 Z" fill="url(#cybPlate)"/>
    <!-- Cyber Ocular Sensor (Facing Left, Blood Red Glow) -->
    <rect x="62" y="44" width="16" height="6" rx="2" fill="#EF4444" filter="url(#cybGlow)"/>
    <rect x="64" y="46" width="12" height="2" fill="#FEE2E2"/>
    <!-- Cranial Neural Ports -->
    <circle cx="86" cy="38" r="2.5" fill="#00F5D4"/>
    <circle cx="90" cy="44" r="2.5" fill="#00F5D4"/>
  </g>

  <!-- Arm Aiming Heavy Assault Rifle (Facing Left) -->
  <g id="cyb-arm-gun">
    <!-- Heavy Mechanical Shoulder Pauldron -->
    <rect x="64" y="74" width="18" height="16" rx="4" fill="url(#cybPlate)"/>
    <circle cx="73" cy="82" r="4" fill="#EF4444"/>
    <!-- Arm -->
    <path d="M70 80 L32 80 L30 96 L70 96 Z" fill="url(#cybArmor)"/>
    <rect x="24" y="80" width="10" height="14" rx="2" fill="#0F172A"/>

    <!-- Heavy Assault Plasma Rifle -->
    <rect x="24" y="92" width="8" height="16" rx="2" fill="#0F172A"/>
    <!-- Main Receiver & Cooling Fins -->
    <rect x="-8" y="74" width="48" height="18" rx="3" fill="#1E293B"/>
    <!-- Cooling Shroud Slots -->
    <rect x="0" y="78" width="6" height="10" fill="#0F172A"/>
    <rect x="8" y="78" width="6" height="10" fill="#0F172A"/>
    <rect x="16" y="78" width="6" height="10" fill="#0F172A"/>
    <!-- Plasma Coil Glowing Core -->
    <rect x="2" y="81" width="22" height="4" fill="#00F5D4" filter="url(#cybGlow)"/>
    <!-- Extended Barrel & Heavy Muzzle Brake -->
    <rect x="-18" y="78" width="12" height="10" fill="#0F172A"/>
    <rect x="-24" y="76" width="8" height="14" fill="#334155"/>
    <!-- High-Magnification Scope -->
    <rect x="4" y="66" width="22" height="6" fill="#0F172A"/>
    <circle cx="6" cy="69" r="2.5" fill="#EF4444"/>
  </g>
</svg>
