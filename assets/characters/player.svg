<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220" width="160" height="220">
  <defs>
    <linearGradient id="pCoat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A55"/>
      <stop offset="100%" stop-color="#B31238"/>
    </linearGradient>
    <linearGradient id="pSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8A882"/>
      <stop offset="100%" stop-color="#C57E58"/>
    </linearGradient>
    <linearGradient id="pGun" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D3436"/>
      <stop offset="50%" stop-color="#4A5568"/>
      <stop offset="100%" stop-color="#1A202C"/>
    </linearGradient>
    <filter id="pGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Shadow Base -->
  <ellipse cx="80" cy="208" rx="36" ry="7" fill="rgba(10, 8, 20, 0.45)"/>

  <!-- Left Leg & Combat Boot (Back) -->
  <g id="p-leg-left">
    <rect x="62" y="136" width="16" height="54" rx="4" fill="#252636"/>
    <rect x="60" y="160" width="18" height="6" fill="#181924"/>
    <path d="M58 190 L80 190 L82 206 L54 206 Z" fill="#E2E8F0"/>
    <rect x="54" y="202" width="28" height="6" fill="#0F172A"/>
  </g>

  <!-- Right Leg & Combat Boot (Front) -->
  <g id="p-leg-right">
    <rect x="80" y="138" width="16" height="52" rx="4" fill="#32344A"/>
    <rect x="78" y="164" width="18" height="6" fill="#1E2030"/>
    <path d="M78 190 L102 190 L106 206 L74 206 Z" fill="#FFFFFF"/>
    <rect x="74" y="202" width="32" height="6" fill="#0F172A"/>
  </g>

  <!-- Torso & Combat Armor -->
  <g id="p-torso">
    <rect x="64" y="80" width="32" height="58" rx="3" fill="#12131A"/>
    <rect x="72" y="84" width="16" height="48" fill="#1E293B"/>
    <path d="M58 78 L100 78 L96 142 L56 142 Z" fill="url(#pCoat)"/>
    <path d="M60 74 L74 96 L70 134 L56 134 Z" fill="#E01B4C"/>
    <path d="M98 74 L84 96 L88 134 L98 134 Z" fill="#E01B4C"/>
    <line x1="72" y1="92" x2="72" y2="126" stroke="#4FD1C5" stroke-width="2.5" filter="url(#pGlow)"/>
    <rect x="60" y="132" width="38" height="8" fill="#111827"/>
    <rect x="74" y="130" width="12" height="12" fill="#F59E0B"/>
  </g>

  <!-- Head & Hair -->
  <g id="p-head">
    <rect x="74" y="66" width="12" height="14" fill="url(#pSkin)"/>
    <rect x="68" y="38" width="26" height="30" rx="6" fill="url(#pSkin)"/>
    <path d="M62 38 L98 34 L102 48 L94 48 L92 38 L68 40 L62 54 L60 42 Z" fill="#1F162B"/>
    <path d="M66 28 L84 18 L94 28 L98 22 L104 36 L66 38 Z" fill="#2E213D"/>
    <rect x="74" y="44" width="24" height="8" rx="2" fill="#00F5D4" filter="url(#pGlow)"/>
    <rect x="76" y="46" width="20" height="2" fill="#FFFFFF"/>
    <rect x="66" y="46" width="5" height="10" rx="2" fill="#F59E0B"/>
  </g>

  <!-- Extended Aiming Right Arm & Cyber Blaster Pistol -->
  <g id="p-arm-gun">
    <circle cx="86" cy="84" r="10" fill="#B31238"/>
    <path d="M86 78 L124 78 L126 92 L86 94 Z" fill="url(#pCoat)"/>
    <rect x="122" y="78" width="10" height="12" rx="3" fill="url(#pSkin)"/>
    <rect x="124" y="88" width="8" height="16" rx="2" fill="#1A202C"/>
    <rect x="118" y="74" width="36" height="15" rx="3" fill="url(#pGun)"/>
    <rect x="152" y="77" width="6" height="9" fill="#0F172A"/>
    <rect x="124" y="72" width="24" height="3" fill="#00F5D4" filter="url(#pGlow)"/>
    <circle cx="148" cy="81" r="3" fill="#F59E0B"/>
  </g>
</svg>
